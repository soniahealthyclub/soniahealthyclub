<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Sonia Healthy Club | BMI Calculator</title>
<style>
:root{--bg:#fff7fb;--card:#fff;--ink:#2a2a2a;--muted:#7a7a7a;--accent:#ff71b8;--accent2:#ffd1e6}
*{box-sizing:border-box} body{margin:0;font-family:ui-rounded,system-ui,-apple-system,Segoe UI,Roboto,Noto Sans Thai,Arial;background:var(--bg);color:var(--ink)}
.wrap{max-width:760px;margin:24px auto;padding:0 16px}
.card{background:var(--card);border-radius:22px;padding:20px;box-shadow:0 10px 30px rgba(255,113,184,.15),0 6px 16px rgba(0,0,0,.06)}
h1{margin:0 0 6px;font-size:24px} .lead{color:var(--muted);margin:0 0 14px}
.grid{display:grid;gap:10px} @media(min-width:720px){.grid{grid-template-columns:repeat(2,1fr)}}
label{font-size:13px;font-weight:700;color:#9d3d6c;display:block;margin:6px 0}
input{width:100%;padding:12px 14px;border:2px solid var(--accent2);border-radius:16px;outline:none;background:#fff}
input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(255,113,184,.15)}
.btn{border:0;background:var(--accent);color:#fff;padding:12px 18px;border-radius:18px;font-weight:800;cursor:pointer;margin-top:8px}
.box{margin-top:12px;border:2px dashed var(--accent2);border-radius:18px;padding:12px;text-align:center;background:linear-gradient(180deg,#fff,#fff6fa)}
.big{font-size:26px;font-weight:900} .sub{font-size:12px;color:var(--muted)}
.note{margin-top:12px;font-size:12px;color:var(--muted)}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;background:#ffe3f0;margin-top:6px}
</style></head><body>
<div class="wrap"><div class="card">
  <h1>คำนวณ BMI (ดัชนีมวลกาย)</h1>
  <p class="lead">เครื่องมือวัดน้ำหนักสัมพันธ์ส่วนสูง ใช้เกณฑ์มาตรฐาน และให้ช่วงน้ำหนักเหมาะสมสำหรับความสูงของคุณ</p>

  <div class="grid">
    <div><label>ส่วนสูง (ซม.)</label><input id="h" type="number" min="120" max="220" value="163"/></div>
    <div><label>น้ำหนัก (กก.)</label><input id="w" type="number" min="30" max="250" step="0.1" value="64.0"/></div>
  </div>
  <button class="btn" onclick="calc()">คำนวณ ⭐</button>

  <div class="box">
    <div class="sub">ผลลัพธ์ BMI</div>
    <div class="big" id="bmi">—</div>
    <div id="cat" class="badge">—</div>
    <div class="sub" id="range">ช่วงน้ำหนักเหมาะสม: — กก.</div>
  </div>

  <div class="note">
    หมายเหตุ: BMI เป็นตัวชี้วัดภาพรวม ไม่แยกมวลกล้าม/ไขมัน เหมาะใช้ร่วมกับสัดส่วนร่างกายและการประเมินจากผู้เชี่ยวชาญ
  </div>
</div></div>

<script>
const set=(id,t)=>document.getElementById(id).textContent=t;
function catOf(x){
  if(x<18.5) return "น้ำหนักน้อย";
  if(x<23) return "ปกติ (เอเชีย)";
  if(x<25) return "ท้วม";
  if(x<30) return "อ้วนระดับ 1";
  return "อ้วนระดับ 2";
}
function calc(){
  const h=parseFloat(document.getElementById('h').value||0), w=parseFloat(document.getElementById('w').value||0);
  if(h<=0||w<=0) return;
  const m=h/100, bmi=w/(m*m);
  set('bmi', bmi.toFixed(1));
  set('cat', catOf(bmi));
  // ช่วงน้ำหนักตามเกณฑ์ปกติเอเชีย 18.5–22.9
  const lo=(18.5*m*m), hi=(22.9*m*m);
  set('range', `ช่วงน้ำหนักเหมาะสม: ${lo.toFixed(1)}–${hi.toFixed(1)} กก.`);
  // จำค่า
  localStorage.setItem('shc_bmi', JSON.stringify({h,w}));
}
window.addEventListener('load', ()=>{
  const raw=localStorage.getItem('shc_bmi'); if(raw){try{const d=JSON.parse(raw); h.value=d.h; w.value=d.w;}catch{}}
  calc();
});
</script>
</body></html>
