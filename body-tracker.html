<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Sonia Healthy Club | Body Tracker</title>
  <style>
    body{margin:0;font-family:'Prompt',sans-serif;background:#fff0f6;color:#333}
    .wrap{max-width:900px;margin:20px auto;padding:20px}
    h1{text-align:center;color:#ff4da6}
    .card{background:#fff;border-radius:16px;padding:20px;margin-bottom:20px;
          box-shadow:0 6px 12px rgba(255,0,128,0.1)}
    label{display:block;margin:8px 0 4px}
    input{width:100%;padding:8px;border:1px solid #ccc;border-radius:8px}
    button{background:#ff4da6;color:#fff;border:0;padding:10px 18px;border-radius:8px;cursor:pointer;font-weight:600}
    button:hover{background:#e60073}
    table{width:100%;border-collapse:collapse;margin-top:15px;font-size:14px}
    th,td{border:1px solid #f9cce0;padding:6px;text-align:center}
    th{background:#ffe6f0}
    .btn-group{margin:10px 0;text-align:center}
    .btn-group button{margin:4px}
    .sub{font-weight:bold;margin-bottom:10px;color:#ff4da6}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Body Measurement Tracker 📏</h1>

    <div class="card">
      <label>วันที่</label>
      <input type="date" id="date">
      <label>น้ำหนัก (กก.)</label>
      <input type="number" id="weight" step="0.1">
      <label>เอว (ซม.)</label>
      <input type="number" id="waist" step="0.1">
      <label>สะโพก (ซม.)</label>
      <input type="number" id="hip" step="0.1">
      <label>หน้าอก (ซม.)</label>
      <input type="number" id="chest" step="0.1">
      <label>ต้นขา (ซม.)</label>
      <input type="number" id="thigh" step="0.1">
      <label>ต้นแขน (ซม.)</label>
      <input type="number" id="arm" step="0.1">

      <div class="btn-group">
        <button onclick="save()">บันทึกข้อมูลวันนี้ ⭐</button>
        <button onclick="clearAll()">ล้างข้อมูลทั้งหมด</button>
        <button onclick="exportCSV()">Export CSV</button>
      </div>
    </div>

    <div class="card">
      <div class="sub">ค่าอัตราส่วนล่าสุด</div>
      <p>WHR (เอว/สะโพก): <span id="whr">-</span></p>
      <p>WHtR (เอว/ส่วนสูง*): <span id="whtr">-</span></p>
      <small>*ต้องกรอกส่วนสูงในโค้ดเองนะคะ (แก้ได้ใน script)</small>
    </div>

    <div class="card">
      <div class="sub">แนวโน้ม 7 ครั้งล่าสุด (เอว • น้ำหนัก • สะโพก)</div>
      <canvas id="lineChart" height="140"></canvas>
    </div>

    <div class="card">
      <div class="sub">ประวัติการบันทึก</div>
      <table id="table">
        <thead>
          <tr>
            <th>วันที่</th><th>น้ำหนัก</th><th>เอว</th><th>สะโพก</th>
            <th>WHR</th><th>WHtR</th><th>หน้าอก/ต้นขา/ต้นแขน</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    let data = JSON.parse(localStorage.getItem("bodyData")||"[]");

    function save(){
      const obj = {
        date: document.getElementById('date').value || new Date().toISOString().slice(0,10),
        weight: parseFloat(document.getElementById('weight').value)||0,
        waist: parseFloat(document.getElementById('waist').value)||0,
        hip: parseFloat(document.getElementById('hip').value)||0,
        chest: parseFloat(document.getElementById('chest').value)||0,
        thigh: parseFloat(document.getElementById('thigh').value)||0,
        arm: parseFloat(document.getElementById('arm').value)||0
      };
      data.push(obj);
      localStorage.setItem("bodyData",JSON.stringify(data));
      render();
    }

    function clearAll(){
      if(confirm("ล้างข้อมูลทั้งหมด?")){
        data=[];localStorage.removeItem("bodyData");render();
      }
    }

    function exportCSV(){
      if(!data.length) return alert("ไม่มีข้อมูล");
      let csv="วันที่,น้ำหนัก,เอว,สะโพก,หน้าอก,ต้นขา,ต้นแขน\\n";
      data.forEach(r=>{
        csv+=`${r.date},${r.weight},${r.waist},${r.hip},${r.chest},${r.thigh},${r.arm}\\n`;
      });
      const blob=new Blob([csv],{type:"text/csv"});
      const a=document.createElement("a");
      a.href=URL.createObjectURL(blob);a.download="body-tracker.csv";a.click();
    }

    function render(){
      const tbody=document.querySelector("#table tbody");
      tbody.innerHTML="";
      data.slice().reverse().forEach(r=>{
        const whr = r.hip? (r.waist/r.hip).toFixed(2):"-";
        const whtr = 160? (r.waist/160).toFixed(2):"-"; // สมมติส่วนสูง 160 ซม.
        tbody.innerHTML+=`
          <tr>
            <td>${r.date}</td><td>${r.weight}</td><td>${r.waist}</td><td>${r.hip}</td>
            <td>${whr}</td><td>${whtr}</td>
            <td>อก ${r.chest} • ขา ${r.thigh} • แขน ${r.arm}</td>
          </tr>`;
      });

      if(data.length){
        const last=data[data.length-1];
        document.getElementById('whr').innerText = last.hip? (last.waist/last.hip).toFixed(2):"-";
        document.getElementById('whtr').innerText = 160? (last.waist/160).toFixed(2):"-";
      }

      const last7=data.slice(-7);
      if(last7.length) renderLineChart(last7);
    }

    function renderLineChart(last7){
      const ctx=document.getElementById('lineChart').getContext('2d');
      if(window.myChart) window.myChart.destroy();
      window.myChart=new Chart(ctx,{
        type:'line',
        data:{
          labels:last7.map(x=>x.date),
          datasets:[
            {label:'เอว (ซม.)',data:last7.map(x=>x.waist),
             borderColor:'#ff71b8',backgroundColor:'#ffd6ec',fill:false,tension:0.3},
            {label:'น้ำหนัก (กก.)',data:last7.map(x=>x.weight),
             borderColor:'#999',backgroundColor:'#ddd',fill:false,tension:0.3},
            {label:'สะโพก (ซม.)',data:last7.map(x=>x.hip),
             borderColor:'#b37aff',backgroundColor:'#e5d4ff',fill:false,tension:0.3}
          ]
        },
        options:{plugins:{legend:{position:'bottom'}},scales:{y:{beginAtZero:false}}}
      });
    }

    render();
  </script>
</body>
</html>
